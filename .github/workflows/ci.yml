name: references

# Every reference solution must deliver in every toolchain. No model and no API key needed.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install git+https://github.com/IonutzHerbil/jig-lang.git -e .[dev]
      - run: pytest
